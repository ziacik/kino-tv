name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - app/build.gradle.kts

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version from source
        id: version
        shell: bash
        run: |
          version_name="$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)"\s*$/\1/p' app/build.gradle.kts | head -n1)"
          version_code="$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+)\s*$/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kino-release.jks"

      - name: Verify
        run: |
          if ! ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace --no-configuration-cache; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          fi

      - name: Build signed release APK
        env:
          KINO_KEYSTORE_FILE: ${{ runner.temp }}/kino-release.jks
          KINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-configuration-cache

      - name: Verify release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" "kino-${VERSION_NAME}.apk"
          sha256="$(sha256sum "kino-${VERSION_NAME}.apk" | awk '{print $1}')"
          cat > kino-update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkName": "kino-${VERSION_NAME}.apk",
            "sha256": "${sha256}"
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kino-${{ steps.version.outputs.name }}
          path: |
            kino-${{ steps.version.outputs.name }}.apk
            kino-update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          tag="v${VERSION_NAME}"
          apk="kino-${VERSION_NAME}.apk"
          metadata="kino-update.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$metadata" --clobber
          else
            gh release create "$tag" "$apk" "$metadata" --target "$GITHUB_SHA" --generate-notes --title "Kino ${VERSION_NAME}"
          fi
