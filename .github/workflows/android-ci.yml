name: Android CI

on:
  push:
    branches:
      - master
      - feature/foundation
      - feature/torrent-playback-proof
      - feature/movie-catalog-search
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TMDB_API_KEY: ci-placeholder
  OPENSUBTITLES_API_KEY: ci-placeholder

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify deploy script
        run: |
          test -x deploy-debug
          sh -n deploy-debug

      - name: Verify old libtorrent backend is gone
        run: |
          ! grep -R -E 'libtorrent4j|TorrentPieceAccess' app/src app/build.gradle.kts gradle/libs.versions.toml

      - name: Verify Media3 MKV fix version
        run: grep -q '^media3 = "1.11.1"$' gradle/libs.versions.toml

      - name: Unit tests and lint
        run: |
          if ! ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace --no-configuration-cache; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          fi

      - name: Compile debug APK and instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleAndroidTest --stacktrace --no-configuration-cache

      - name: Verify TorrServer executable packaging
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            unzip -p app/build/outputs/apk/debug/app-debug.apk "lib/$abi/libtorrserver.so" > /dev/null
          done

      - name: Verify clean 32-bit TorrServer ABI switch
        run: |
          ./gradlew :app:prepareTorrServerBinary -PtorrserverAbi=armeabi-v7a --stacktrace --no-configuration-cache
          test -f app/build/generated/torrserver/jniLibs/armeabi-v7a/libtorrserver.so
          test ! -e app/build/generated/torrserver/jniLibs/arm64-v8a/libtorrserver.so

      - name: Verify universal TorrServer ABI restore
        run: |
          ./gradlew :app:prepareTorrServerBinary --stacktrace --no-configuration-cache
          test -f app/build/generated/torrserver/jniLibs/armeabi-v7a/libtorrserver.so
          test -f app/build/generated/torrserver/jniLibs/arm64-v8a/libtorrserver.so

      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
